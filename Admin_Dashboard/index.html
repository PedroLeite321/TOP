<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
</head>
<body>
    <!--Its a 4x4 grid-->
    <main class="dashboard-container-hero">
        <section class="grid-main-area side-layout">
            <header class="flex-header">
                <picture class="header_picture">

                </picture>
                <h2>Admin Dashboard</h2>
            </header>
            <nav class="nav_header">
                <ul>
                    <li class="nav_side_router_icons"><span class="icon home-icon"></span>Home</li>
                    <li class="nav_side_router_icons"><span class="icon profile-icon"></span>Profile</li>
                    <li class="nav_side_router_icons"><span class="icon message-icon"></span>Messages</li>
                    <li class="nav_side_router_icons"><span class="icon clock-icon"></span>History</li>
                    <li class="nav_side_router_icons"><span class="icon task-icon"></span>Tasks</li>
                    <li class="nav_side_router_icons"><span class="icon community-icon"></span>Communities</li>
                </ul>
                <ul>
                    <li class="supportive-side-routericons"><span class="icon setting-icon"></span>Settings</li>
                    <li class="supportive-side-routericons"><span class="icon interrogation-icon"></span>Support</li>
                    <li class="supportive-side-routericons"><span class="icon shield-icon"></span>Privacy</li>
                </ul>
            </nav>
        </section>
        <section class="grid-main-area top-layout">
            <fieldset>
                <input type="button" value="confirm_icon">
                <input type="text" name="search-bar" id="search_bar">
            </fieldset>
            <section class="profile_icons">

            </section>
            <section class="profile_photo_container">
                <picture class="profile_picture">
                    
                </picture>
                <p>Hi there,</p>
                <h2>Morgan Oakley (@Morgan)</h2>
            </section>

        </section>
        <section class="grid-main-area mid-layout">
            <div class="projects_showcase_area">
                
            </div>
            <div class="projects_showcase_area">

            </div>
            <div class="projects_showcase_area">

            </div>
            <div class="projects_showcase_area">

            </div>
            <div class="projects_showcase_area">

            </div>
            <div class="projects_showcase_area">

            </div>
            <div class="projects_showcase_area">

            </div>
            <div class="projects_showcase_area">
                
            </div>
        </section>
    </main>
</body>
</html>
