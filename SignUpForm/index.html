<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <!--Styles-->
    <link rel="stylesheet" href="./assets/styles/reset.css">
    <link rel="stylesheet" href="./assets/styles/main.css">
    <title>Sign-In Form</title>
</head>
<body>
    <main class="wrap-content">
        <section class="left-hero">
            
            <div class="transparent_section">
                <picture class="img-hero">
                    <img class="img-odin-face" src="./assets/images/odin-lined.png" alt="Odin Face">
                </picture>
                <header class="left-section-header">
                    <h1>ODIN</h1>
                </header>
            </div>
        </section>
        <section class="right-hero">
            <section class="paragraph-hero">
                <p>This is not a real online service. You know you need something like this in your life to help you realize your deepest dreams.
Sign up now to get started.</p>

                <p>You know you want to.</p>
            </section>
            <section class="form-area">
                <form class="form-area-form" action="post">
                    <fieldset class="form-hero">

                        <div class="wrap-form">
                            <label class="form-label" for="first-name">First Name</label>
                            <input class="form-input" type="text" name="first-name">
                        </div>

                        <div class="wrap-form">
                            <label class="form-label" for="email">E-mail</label>
                            <input class="form-input" type="text" name="email">
                        </div>

                        <div class="wrap-form">
                            <label class="form-label" for="pw">Password</label>
                            <input class="form-input" type="text" name="pw">
                        </div>

                        <div class="wrap-form">
                            <label class="form-label" for="last-name">Last Name</label>
                            <input class="form-input" type="text" name="last-name">
                        </div>

                        <div class="wrap-form">
                            <label class="form-label" for="phone-number">Phone Number</label>
                            <input class="form-input" type="text" name="phone-number">
                        </div>
                        
                        <div class="wrap-form">    
                            <label class="form-label" for="confirm-pw">Confirm Password</label>
                            <input class="form-input" type="text" name="confirm-pw">
                        </div>

                    </fieldset>
                </form>
            </section>
            <section class="right-footer">
                <input type="button" value="Create Account">
                <p>Already have an account? <span class="green-emp">Log in</span></p>
            </section>
        </section>
    </main>
</body>
</html>
